<style>

:root[data-theme="dark"]{--bg:#0d1424;--card:#16203a;--ink:#eef2fb;--mute:#93a1bd;--line:#26335a;--soft:#1b2745;--acc:#3dd1de;--bad:#ff7d82;--badbg:#3a1d2a;--warn:#f2c46a;--warnbg:#3a3017;--free:#12342a;--freeline:#3fbf86;--freeink:#7be3b0;--shadow:0 6px 24px rgba(0,0,0,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:14px 14px 48px}
.hero{border-radius:24px;padding:26px 26px 22px;color:#fff;background:radial-gradient(900px 300px at 85% -20%,rgba(255,138,31,.75),transparent 60%),radial-gradient(700px 300px at 0% 120%,rgba(14,154,167,.9),transparent 60%),linear-gradient(135deg,#12284c,#1b3d73);box-shadow:var(--shadow);position:relative;overflow:hidden}

.tab{flex:none;border:2px solid transparent;border-radius:999px;padding:7px 16px;background:var(--card);color:var(--ink);font-weight:600;font-size:13px;cursor:pointer;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}

.tab.all.on{background:var(--ink);color:var(--bg)}
.main{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start;margin-top:10px}

.co{background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;border:1px solid var(--line)}

.body{padding:6px 14px 4px}

.banner{margin-top:12px}

.ebtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.cnav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}

.days .wh{text-align:center;font-size:10px;font-weight:600;color:var(--mute);padding:2px 0}

.blk.fr{cursor:pointer}
.edit input[type=time]{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.gbtn{border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:600;color:#fff;background:linear-gradient(135deg,#12284c,#0e9aa7);cursor:pointer}
.foot{display:flex;gap:8px;justify-content:center;padding:0 0 100px}
.foot button{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:7px 14px;font:inherit;font-size:12px;cursor:pointer}

.live{display:inline-flex;gap:7px;align-items:center;font-size:11px;opacity:.9;margin-left:auto}

.focus{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.focus b{font-size:22px;font-variant-numeric:tabular-nums}
.fb{border:0;border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer;background:#fff;color:#12284c}.fb.g{background:rgba(255,255,255,.18);color:#fff}
.qc{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:14px;margin-bottom:16px}
.qc .r{display:flex;gap:8px;flex-wrap:wrap}
.qc input,.qc select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.qc .ti{flex:1 1 200px}
.qc .go{border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:600;color:#fff;background:linear-gradient(135deg,#12284c,#0e9aa7);cursor:pointer}
.qd{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.qd button{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
.qd button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qd input{max-width:150px;flex:1;padding:6px 12px;border-radius:999px}
.bar{display:none}
@media (max-width:900px){
.wrap{padding:10px 10px 96px}
.bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));gap:6px}
.bar button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;font-size:12px;padding:6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.bar button span{font-size:20px;line-height:1}.bar button.on{color:var(--acc);background:var(--soft)}
.v-tasks .cal{display:none}.v-cal .main>div:first-child{display:none}
.hero{padding:20px 18px}
.t{padding:14px 2px}.chk{width:30px;height:30px}.star,.del{font-size:22px;padding:0 6px}
.add input,.newco input,.qc input,.qc select,.hrs select{font-size:16px}
.coh .x{width:38px;height:38px}
.live{margin-left:0}
}
</style>
</head>

    else if(n==="add"){T(520,0,.09,"triangle",.14);T(780,.07,.16,"triangle",.14)}

    else if(n==="star"){T(1046,0,.1,"sine",.12);T(1568,.06,.2,"sine",.12)}
    else if(n==="start"){T(440,0,.1,"triangle",.13);T(660,.09,.16,"triangle",.13)}

  }catch(e){}
}
